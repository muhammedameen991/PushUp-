<html lang="en">
  <head>

    <meta name="description" content="PushUp — Small reps. Big progress. Web app with real-time camera pose tracking, manual counter, 3D biomechanics visualizer, and local progress tracking." />

    <meta name="theme-color" content="#F5F4EF" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Client-side TensorFlow.js and MoveNet SinglePose Lightning runtime -->
    <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

  <body class="bg-[#F5F4EF] text-[#262624] antialiased selection:bg-[#C5684D]/20 selection:text-[#C5684D]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for offline support
      if ('serviceWorker' in navigator && !window.location.hostname.includes('localhost.disabled')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
